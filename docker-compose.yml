services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: delivery3d-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env
    environment:
      # Desde el contenedor, MySQL del host se alcanza por host.docker.internal
      - DB_HOST=host.docker.internal
    volumes:
      - ./backend:/app
      - /app/.venv
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - default
      - personal-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: delivery3d-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - BACKEND_URL=http://backend:5000
      - CHOKIDAR_USEPOLLING=true
      - WDS_SOCKET_PORT=0
      - DANGEROUSLY_DISABLE_HOST_CHECK=true
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - default
      - personal-net

networks:
  default:
  personal-net:
    external: true
    name: personal-net

name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (ruff + pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      mysql:
        image: mysql:8.0
        env:
          # Base efímera solo para CI: credenciales descartables, no son secretos del proyecto.
          MYSQL_ROOT_PASSWORD: ci_root
          MYSQL_DATABASE: delivery3d_test
          MYSQL_USER: ci_user
          MYSQL_PASSWORD: ci_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci_root"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      DB_HOST: 127.0.0.1
      DB_PORT: "3306"
      DB_USER: ci_user
      DB_PASSWORD: ci_password
      DB_NAME: delivery3d_test
      DB_TEST_NAME: delivery3d_test
      SEED_OPERATOR_PASSWORD: ci-not-used
      PYTHONPATH: .

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Generar JWT_SECRET_KEY efímero
        run: echo "JWT_SECRET_KEY=$(python -c 'import secrets; print(secrets.token_urlsafe(48))')" >> "$GITHUB_ENV"

      - name: Collation del proyecto (utf8mb4_unicode_ci)
        run: >-
          mysql -h 127.0.0.1 -uroot -pci_root
          -e "ALTER DATABASE delivery3d_test CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;"

      - name: Lint (ruff)
        run: ruff check app/ tests/ seeds/ tools/

      # Los tests crean el esquema con create_all; acá se valida el camino real:
      # migraciones desde cero, modelos == base (flask db check + CHECKs) y downgrade.
      - name: Migraciones desde cero y chequeo de esquema
        env:
          DB_NAME: delivery3d_migrated
        run: |
          mysql -h 127.0.0.1 -uroot -pci_root -e "CREATE DATABASE delivery3d_migrated CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci; GRANT ALL ON delivery3d_migrated.* TO 'ci_user'@'%';"
          flask db upgrade
          flask db check
          python -m tools.schema_check
          flask db downgrade
          flask db upgrade

      - name: Tests (pytest)
        run: pytest -q

  frontend:
    name: Frontend (jest + build)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci --no-audit --no-fund

      - name: Tests (jest)
        run: npm test -- --watchAll=false
        env:
          CI: "true"

      - name: Build de producción
        run: npm run build
        env:
          CI: "true"
